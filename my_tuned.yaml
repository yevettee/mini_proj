camera:
  i_pipeline_type: RGBD          # ← 이게 제일 중요. RGB만 하면 depth 자체가 안 나옴

stereo:
  i_align_depth: true            # ← RGB 프레임에 depth를 맞추겠다는 뜻
  i_board_socket_id: 0           # ← RGB 소켓 (OAK-D에서 거의 항상 0)
  i_output_depth: true
  i_lr_check: true
  i_subpixel: true
  i_depth_preset: HIGH_ACCURACY
